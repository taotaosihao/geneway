# P1-compatible P2 product runtime: keep the DSH Agent/Session/JSONL kernel and
# the contracted native tools. The profile deliberately has no shell, filesystem, web, MCP,
# subagent, telemetry, DeepSeek-default route, or session-log side channel.
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: llm-deepseek
  disabled: true
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: mcp-resources
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: ptc-runtime
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      zenmux:
        displayName: ZenMux
        api: openai-completions
        apiKeyEnv: ZENMUX_API_KEY
        baseURL: https://zenmux.ai/api/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            contextWindow: 200000
            maxOutputTokens: 8192
- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    personaPrefix: You are Geneway's constrained manufacturing fact explanation agent.
    personaSuffix: ''
    includeHarnessIdentity: false
    includeRuntimeContext: false
- insert:
    - id: gearjob-work-order
      name: ../plugins/gearjob-work-order.mjs
    - id: cycle-time
      name: ../plugins/cycle-time.mjs
    - id: work-order-device-correlation
      name: ../plugins/work-order-device-correlation.mjs
    - id: execution-request-guard
      name: ../plugins/execution-request-guard.mjs
