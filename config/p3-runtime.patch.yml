# Narrow long-lived in-process profile for product collaboration. Product tools
# are registered by the host and authorized against Agent object identity.
- id: sdk-app-startup
  disabled: true
- id: sdk-jsonrpc-server
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: llm-deepseek
  disabled: true
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: command-compact
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: mcp-resources
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: ptc-runtime
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      geneway-p3-capture:
        displayName: Geneway P3 local capture
        api: openai-completions
        apiKeyEnv: GENEWAY_P3_CAPTURE_KEY
        baseURL: !!js process.env.GENEWAY_P3_CAPTURE_BASE_URL
        compat:
          supportsUsageInStreaming: true
          supportsFinishReason: true
          maxTokensField: max_tokens
        models:
          - id: p3-runtime-test
            name: P3 runtime test
            contextWindow: 8192
            maxOutputTokens: 4096
      zenmux:
        displayName: ZenMux
        api: openai-completions
        apiKeyEnv: ZENMUX_API_KEY
        baseURL: https://zenmux.ai/api/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            contextWindow: 200000
            maxOutputTokens: 4096
- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    personaPrefix: You are a constrained Geneway manufacturing collaboration employee.
    personaSuffix: ''
    includeHarnessIdentity: false
    includeRuntimeContext: false
- id: subagent
  disabled: false
  config:
    maxDepth: 1
- id: subagent-spawn-in-process
  disabled: false
  config:
    providerName: spawn
- id: agent-loop
  config:
    agents: []
