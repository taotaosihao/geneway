services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: geneway
      POSTGRES_PASSWORD: ${GENEWAY_BACKUP_POSTGRES_PASSWORD:?GENEWAY_BACKUP_POSTGRES_PASSWORD is required}
      POSTGRES_DB: geneway_backup
    ports:
      - "127.0.0.1:${GENEWAY_BACKUP_POSTGRES_PORT:?GENEWAY_BACKUP_POSTGRES_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geneway -d geneway_backup"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  versitygw:
    image: ghcr.io/versity/versitygw@sha256:7d56e0a6c246f00e2385ba4fe84065981959be1d822648f88a155c82e0e0652d
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: :7070
      VGW_ADMIN_PORT: :7071
      VGW_HEALTH: /health
      VGW_IAM_DIR: /iam
      VGW_VERSIONING_DIR: /versions
      ROOT_ACCESS_KEY_ID: ${GENEWAY_BACKUP_S3_ACCESS_KEY_ID:?GENEWAY_BACKUP_S3_ACCESS_KEY_ID is required}
      ROOT_SECRET_ACCESS_KEY: ${GENEWAY_BACKUP_S3_SECRET_ACCESS_KEY:?GENEWAY_BACKUP_S3_SECRET_ACCESS_KEY is required}
      VGW_QUIET: "true"
    ports:
      - "127.0.0.1:${GENEWAY_BACKUP_S3_PORT:?GENEWAY_BACKUP_S3_PORT is required}:7070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7070/health"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - versity_data:/data
      - versity_iam:/iam
      - versity_versions:/versions

volumes:
  postgres_data: {}
  versity_data: {}
  versity_iam: {}
  versity_versions: {}
