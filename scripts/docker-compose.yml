services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: geneway
      POSTGRES_PASSWORD: geneway
      POSTGRES_DB: geneway_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geneway -d geneway_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
